[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slicerel-unet"
version = "0.1.0"
description = "Minimal training code for SliceRel-U-Net"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0",
  "numpy>=1.23",
  "PyYAML>=6.0",
  "nibabel>=5.0",
  "monai==1.5.2",
  "scipy>=1.12,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

